apiVersion: apps/v1
kind: Deployment
metadata:
  name: mq-consume-deployment
  namespace: mq-client-apps
  labels:
    app: mqconsume-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqconsume-app
  template:
    metadata:
      labels:
        app: mqconsume-app
    spec:
      containers:
      - name: mqconsume-app
        image: osaume/python-mq-app-consume:latest
        env:
        - name: HOST_NAME
          value: "192.168.1.52"
        - name: QUEUE_MANAGER_PORT_NUMBER
          value: "1515"
        - name: QUEUE_MANAGER_NAME
          value: "QMGRA"       
        - name: CHANNEL_NAME
          value: "MQCONSUMER"
        - name: QUEUE_NAME
          value: "mqConsumer001"                                      